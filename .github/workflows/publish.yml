name: Publish NuGet package

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACKAGE_OUTPUT: ${{ github.workspace }}/artifacts/packages
      GITHUB_NUGET_SOURCE: https://nuget.pkg.github.com/DeltaZulu-OU/index.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - id: version
        name: Read package version from Directory.Build.props
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("Directory.Build.props").getroot()
          versions = [
              element.text.strip()
              for element in root.iter("Version")
              if element.text and element.text.strip()
          ]
          if len(versions) != 1:
              raise SystemExit(
                  "Directory.Build.props must contain exactly one non-empty Version element"
              )
          print(versions[0])
          PY
          )"
          if ! [[ "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Version '$package_version' in Directory.Build.props is not a supported SemVer package version." >&2
            exit 1
          fi

          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$package_version" >> "$GITHUB_OUTPUT"

      # The guard lives in a script shared verbatim by every publishing repo, so
      # the four cannot drift. It prefers the package feed over tags because tags
      # record only what a tagging workflow published - DurableBuffer publishes
      # without tagging at all, so its released 1.0.0 is invisible to tags.
      - name: Verify the version moves forward
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/verify-version-moves-forward.sh DeltaZulu.Kql "${{ steps.version.outputs.package_version }}"

      - name: Restore locked dependencies
        run: dotnet restore DeltaZulu.Kql.slnx --locked-mode

      - name: Build solution
        run: dotnet build DeltaZulu.Kql.slnx --configuration Release --no-restore

      # Both halves of the version span (CON-0006). Publishing an assembly that
      # has only been exercised against 9.2.0 would ship the span unverified.
      - name: Run conformance tests against Kusto.Language 9.2.0
        run: dotnet test tests/DeltaZulu.Kql.Tests/DeltaZulu.Kql.Tests.csproj --configuration Release --no-build --no-restore

      - name: Run conformance tests against Kusto.Language 12.4.1
        run: dotnet test tests/DeltaZulu.Kql.Tests.V1241/DeltaZulu.Kql.Tests.V1241.csproj --configuration Release --no-build --no-restore

      - name: Pack library
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: dotnet pack src/DeltaZulu.Kql/DeltaZulu.Kql.csproj --configuration Release --no-build --no-restore --output "$PACKAGE_OUTPUT" /p:PackageVersion="$PACKAGE_VERSION"

      - name: Verify the Kusto.Language dependency is a minimum, not a pin
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          package="$PACKAGE_OUTPUT/DeltaZulu.Kql.$PACKAGE_VERSION.nupkg"
          unzip -l "$package"
          unzip -Z1 "$package" | grep -Fx 'lib/net10.0/DeltaZulu.Kql.dll'

          # CON-0006: a bracket pin here would make this assembly unloadable in
          # one of the two host processes. Fail the publish rather than ship it.
          nuspec="$(unzip -p "$package" DeltaZulu.Kql.nuspec)"
          echo "$nuspec" | grep -q 'id="Microsoft.Azure.Kusto.Language" version="9.2.0"' || {
            echo "Kusto.Language dependency is not the expected open-ended minimum 9.2.0." >&2
            echo "$nuspec" | grep -i kusto >&2
            exit 1
          }
          if echo "$nuspec" | grep -iE 'id="Microsoft.Azure.Kusto.Language"[^>]*version="\[' ; then
            echo "Kusto.Language is bracket-pinned. See CON-0006." >&2
            exit 1
          fi

      - name: Create release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Publish package to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/github-packages-nuget.config"
          dotnet new nugetconfig --output "$RUNNER_TEMP" --force
          mv "$RUNNER_TEMP/nuget.config" "$config"
          dotnet nuget add source \
            --username "${{ github.actor }}" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text \
            --name github \
            --configfile "$config" \
            "$GITHUB_NUGET_SOURCE"
          dotnet nuget push "$PACKAGE_OUTPUT"/*.nupkg \
            --api-key "$GITHUB_TOKEN" \
            --configfile "$config" \
            --source github \
            --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            "$PACKAGE_OUTPUT"/*.nupkg
